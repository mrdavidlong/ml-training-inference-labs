# Shared defaults. Local-only binding is safer while learning.
[common]
host = "127.0.0.1"
port = 8000
generation_config = "vllm"

# One small model works on both backends, making comparisons easier.
[backend.metal]
model = "Qwen/Qwen3-0.6B"

[backend.cuda]
model = "Qwen/Qwen3-0.6B"
gpu_memory_utilization = 0.90

# Start here. Small limits make mistakes less expensive.
[profile.learning]
max_model_len = 4096
max_num_seqs = 16
enable_prefix_caching = true

# Favor smoother generation and lower tail latency under mixed workloads.
[profile.latency]
max_model_len = 4096
max_num_seqs = 16
max_num_batched_tokens = 2048
enable_prefix_caching = true

# Favor aggregate throughput. Measure memory and tail latency before increasing.
[profile.throughput]
max_model_len = 4096
max_num_seqs = 128
max_num_batched_tokens = 16384
enable_prefix_caching = true

